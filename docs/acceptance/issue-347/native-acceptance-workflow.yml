name: Issue 347 native acceptance artifact

on:
  pull_request:
    paths:
      - .github/workflows/issue-347-native-acceptance.yml

permissions:
  contents: read

concurrency:
  group: issue-347-native-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  simulator-app:
    name: Unmodified iOS simulator build
    if: github.event.pull_request.number == 361
    runs-on: macos-26
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      APP_ENV: production
      EXPO_NO_TELEMETRY: 1
      EXPO_NO_DOTENV: 1
      HAPPYHERD_APP_BUNDLE_ID: app.happyherd.issue347.acceptance
      HAPPYHERD_BUILD_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      EXPO_PUBLIC_HAPPYHERD_SERVER_URL: http://127.0.0.1:34700
      HAPPYHERD_EAS_PROJECT_ID: ''
# rename:preserve
      HAPPY_EAS_PROJECT_ID: ''
# /rename:preserve
      HAPPYHERD_EAS_OWNER: ''
# rename:preserve
      HAPPY_EAS_OWNER: ''
# /rename:preserve
      APPLE_TEAM_ID: ''
      RCT_NO_LAUNCH_PACKAGER: 1
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Record toolchain and isolate caches
        run: |
          mkdir -p acceptance-artifact "$RUNNER_TEMP/issue-347-metro"
          echo "TMPDIR=$RUNNER_TEMP/issue-347-metro/" >> "$GITHUB_ENV"
          echo "NODE_BINARY=$(command -v node)" >> "$GITHUB_ENV"
          { git rev-parse HEAD; xcodebuild -version; swift --version; xcrun --sdk iphonesimulator --show-sdk-version; ruby --version; node --version; pnpm --version; bun --version; pod _1.17.0_ --version; sysctl hw.memsize hw.ncpu; df -h .; } > acceptance-artifact/toolchain.txt
          test "$(git rev-parse HEAD)" = "$HAPPYHERD_BUILD_COMMIT_SHA"
          git status --porcelain --untracked-files=no > acceptance-artifact/source-status-before.txt
          test ! -s acceptance-artifact/source-status-before.txt
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, subprocess
          files = subprocess.check_output(['git', 'ls-files', '-z', '--', 'server/packages/happyherd-app', 'server/pnpm-lock.yaml', 'server/package.json']).decode().split('\0')
          inputs = {name: hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in files if name and pathlib.Path(name).is_file()}
          pathlib.Path('acceptance-artifact/source-inputs.json').write_text(json.dumps(inputs, indent=2) + '\n')
          runner = {key: os.environ.get(key) for key in ['ImageOS', 'ImageVersion', 'RUNNER_OS', 'RUNNER_ARCH', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT']}
          pathlib.Path('acceptance-artifact/runner.json').write_text(json.dumps(runner, indent=2) + '\n')
          PYCODE
      - name: Install unchanged dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile
      - name: Generate the isolated native host
        run: |
          set -o pipefail
          pnpm --dir server --filter happyherd-app exec expo prebuild --platform ios --no-install > acceptance-artifact/prebuild.log 2>&1
          (cd server/packages/happyherd-app/ios && pod _1.17.0_ install) > acceptance-artifact/pods.log 2>&1
          git diff --exit-code -- server
          cp server/packages/happyherd-app/ios/Podfile.lock acceptance-artifact/Podfile.lock
          test "$(shasum -a 256 server/packages/happyherd-app/ios/Pods/RevenueCat/Sources/Paywalls/PaywallColor.swift | cut -d ' ' -f 1)" = 7d5eb572233ad587841d61be7294b32583d35724be6aa39006982d298774c511
          xcodebuild -project server/packages/happyherd-app/ios/Pods/Pods.xcodeproj \
            -target RevenueCat -configuration Release -sdk iphonesimulator \
            -showBuildSettings SWIFT_OPTIMIZATION_LEVEL=-O | \
            awk '/^[[:space:]]*(SWIFT_COMPILATION_MODE|SWIFT_ENABLE_BATCH_MODE|SWIFT_OPTIMIZATION_LEVEL|SDKROOT)[[:space:]]*=/' \
            > acceptance-artifact/RevenueCat-Release-settings.txt
          test -s acceptance-artifact/RevenueCat-Release-settings.txt
          git status --porcelain --untracked-files=no > acceptance-artifact/source-status-generated.txt
          test ! -s acceptance-artifact/source-status-generated.txt
          python3 - <<'PYCODE'
          import hashlib, json, pathlib
          root = pathlib.Path('server/packages/happyherd-app/ios')
          inputs = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file() and not {'Pods', 'build'}.intersection(p.relative_to(root).parts)}
          pathlib.Path('acceptance-artifact/generated-native-inputs.json').write_text(json.dumps(inputs, indent=2) + '\n')
          PYCODE
      - name: Build unsigned Release simulator app
        timeout-minutes: 65
        shell: bash
        run: |
          set -o pipefail
          build=(xcodebuild -quiet -workspace server/packages/happyherd-app/ios/HappyHerd.xcworkspace
            -scheme HappyHerd -configuration Release -sdk iphonesimulator
            -destination 'generic/platform=iOS Simulator'
            -derivedDataPath "$RUNNER_TEMP/issue-347-derived" -jobs 1 -showBuildTimingSummary
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
            IPHONEOS_DEPLOYMENT_TARGET=15.1 SWIFT_OPTIMIZATION_LEVEL=-O build)
          printf '%q ' "${build[@]}" > acceptance-artifact/build-command.txt
          printf '\n' >> acceptance-artifact/build-command.txt
          "${build[@]}" 2>&1 | tee acceptance-artifact/xcodebuild.log
      - name: Verify and preserve the selected app
        run: |
          export ISSUE347_APP="$RUNNER_TEMP/issue-347-derived/Build/Products/Release-iphonesimulator/HappyHerd.app"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, plistlib
          app = pathlib.Path(os.environ['ISSUE347_APP'])
          bundle = (app / 'main.jsbundle').read_bytes()
          sha = os.environ['HAPPYHERD_BUILD_COMMIT_SHA']
          assert b'http://127.0.0.1:34700' in bundle
          configs = list(app.rglob('EXConstants.bundle/app.config'))
          assert len(configs) == 1
          config = json.loads(configs[0].read_text())
          assert config['extra']['app']['buildCommitSha'] == sha
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          assert info['CFBundleIdentifier'] == 'app.happyherd.issue347.acceptance'
          files = {str(p.relative_to(app)): hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(app.rglob('*')) if p.is_file()}
          receipt = {'sourceSha': sha, 'appSourceTree': __import__('subprocess').check_output(['git', 'rev-parse', 'HEAD:server/packages/happyherd-app']).decode().strip(), 'serverUrl': 'http://127.0.0.1:34700', 'expectedConfigurationDifferencesFromIssue345': ['bundle identifier', 'loopback endpoint', 'embedded build metadata (SHA/timestamp)'], 'expandedAppBytes': sum(p.stat().st_size for p in app.rglob('*') if p.is_file()), 'taskSpecificNativeSourcePatches': [], 'revenueCatSourcePatched': False, 'configuration': 'Release', 'architecture': 'arm64', 'bundleSha256': hashlib.sha256(bundle).hexdigest(), 'bundleIdentifier': info['CFBundleIdentifier'], 'appConfigPath': str(configs[0].relative_to(app)), 'appConfigSha256': hashlib.sha256(configs[0].read_bytes()).hexdigest(), 'files': files}
          pathlib.Path('acceptance-artifact/build-manifest.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          git diff --exit-code -- server
          ditto -c -k --sequesterRsrc --keepParent "$ISSUE347_APP" acceptance-artifact/HappyHerd.app.zip
          shasum -a 256 acceptance-artifact/HappyHerd.app.zip > acceptance-artifact/archive.sha256
          stat -f '%z' acceptance-artifact/HappyHerd.app.zip > acceptance-artifact/archive-bytes.txt
          git status --porcelain --untracked-files=no > acceptance-artifact/source-status-after.txt
          test ! -s acceptance-artifact/source-status-after.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-347-native-receipt-${{ github.event.pull_request.head.sha }}
          path: |
            acceptance-artifact/
            !acceptance-artifact/HappyHerd.app.zip
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: issue-347-ios-app-${{ github.event.pull_request.head.sha }}
          path: acceptance-artifact/HappyHerd.app.zip
          retention-days: 7
          if-no-files-found: error

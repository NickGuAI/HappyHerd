name: CLI Smoke Test

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/happy-cli/**'
      - 'packages/happy-server/**'
      - 'packages/happy-server-self-host/**'
      - 'packages/happy-wire/**'
      - '.github/workflows/cli-smoke-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/happy-cli/**'
      - 'packages/happy-server/**'
      - 'packages/happy-server-self-host/**'
      - 'packages/happy-wire/**'
      - '.github/workflows/cli-smoke-test.yml'
  workflow_dispatch:

jobs:
  smoke-test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 24]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build packages
      run: |
        pnpm --filter @slopus/happy-wire --fail-if-no-match build
        pnpm --filter happy-agent --fail-if-no-match build
        pnpm --filter @happyherd/cli --fail-if-no-match build

    # happy-server-self-host ships only a bundled runtime (no sources), and the
    # bundler is bun.
    - name: Install Bun
      uses: oven-sh/setup-bun@v2

    # `happyherd server` resolves the self-host runtime and bundled webapp from
    # happy-server-self-host. Its build bundles packages/happy-server's
    # standalone entrypoint and copies prisma/ in, so it must run before pack.
    - name: Build happy-server-self-host runtime + bundle webapp
      run: |
        pnpm --filter happy-server-self-host --fail-if-no-match build
        pnpm --filter happy-server-self-host --fail-if-no-match run bundle:webapp

    - name: Pack packages
      run: |
        pnpm --filter @slopus/happy-wire --fail-if-no-match pack --pack-destination packages/happy-wire
        pnpm --filter @happyherd/cli --fail-if-no-match pack --pack-destination packages/happy-cli
        pnpm --filter happy-server-self-host --fail-if-no-match pack --pack-destination packages/happy-server-self-host

    - name: Install packed packages globally
      run: |
        WIRE_PACKAGE_FILE=$(ls packages/happy-wire/*.tgz)
        HAPPY_PACKAGE_FILE=$(ls packages/happy-cli/*.tgz)
        SERVER_PACKAGE_FILE=$(ls packages/happy-server-self-host/*.tgz)
        npm install -g --prefix "$RUNNER_TEMP/happyherd-cli-prefix" \
          "./$WIRE_PACKAGE_FILE" "./$SERVER_PACKAGE_FILE" "./$HAPPY_PACKAGE_FILE"
        echo "$RUNNER_TEMP/happyherd-cli-prefix/bin" >> "$GITHUB_PATH"

    - name: Test binary execution
      run: |
        # Test that the binary starts successfully
        command -v happyherd
        if [ -e "$RUNNER_TEMP/happyherd-cli-prefix/bin/happy" ]; then
          echo "Error: the packed CLI installed a retired happy command"
          exit 1
        fi

        echo "Testing happyherd --help..."
        timeout 30s happyherd --help || {
          echo "Error: happyherd --help failed or timed out"
          exit 1
        }

        echo "Testing happyherd --version..."
        timeout 10s happyherd --version || {
          echo "Error: happyherd --version failed or timed out"
          exit 1
        }

        echo "Testing happyherd doctor..."
        timeout 30s happyherd doctor || {
          echo "Error: happyherd doctor failed or timed out"
          exit 1
        }

        echo "Testing happyherd daemon status..."
        timeout 10s happyherd daemon status || {
          echo "Error: happyherd daemon status failed or timed out"
          exit 1
        }

        echo "Binary smoke test passed on Linux!"

    - name: Test packaged server (happyherd server)
      run: |
        export HAPPY_HOME_DIR="$(mktemp -d)"
        timeout 90s happyherd server --port 4505 --host 127.0.0.1 --no-persist --reset > /tmp/happy-server.log 2>&1 &
        SERVER_PID=$!
        UP=0
        for i in $(seq 1 60); do
          if curl -sf -m 2 http://127.0.0.1:4505/ -o /dev/null; then UP=1; echo "server up after ${i}s"; break; fi
          sleep 1
        done
        # Exercise the Prisma native query engine via a DB-backed read.
        PK=$(node -e "console.log(Buffer.alloc(32).toString('base64'))")
        BODY=$(curl -s -m 5 -G http://127.0.0.1:4505/v1/auth/request/status --data-urlencode "publicKey=$PK" || true)
        echo "auth/request/status -> $BODY"
        kill "$SERVER_PID" 2>/dev/null || true
        pkill -f happy-server || true
        echo "=== happyherd server log ==="; cat /tmp/happy-server.log || true
        if [ "$UP" != "1" ]; then echo "Error: happyherd server did not become healthy"; exit 1; fi
        if ! echo "$BODY" | grep -q '"status"'; then echo "Error: Prisma-backed endpoint did not respond"; exit 1; fi
        if grep -qiE 'PrismaClientInitializationError|could not locate.*Query Engine' /tmp/happy-server.log; then echo "Error: Prisma query engine failed to load"; exit 1; fi
        echo "happyherd server smoke test passed (booted + Prisma query engine OK)"

  smoke-test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [20, 24]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build packages
      run: |
        pnpm --filter @slopus/happy-wire --fail-if-no-match build
        pnpm --filter happy-agent --fail-if-no-match build
        pnpm --filter @happyherd/cli --fail-if-no-match build

    - name: Pack packages
      run: |
        pnpm --filter @slopus/happy-wire --fail-if-no-match pack --pack-destination packages/happy-wire
        pnpm --filter @happyherd/cli --fail-if-no-match pack --pack-destination packages/happy-cli

    - name: Install packed package globally
      shell: cmd
      run: |
        for %%w in (packages\happy-wire\*.tgz) do for %%f in (packages\happy-cli\*.tgz) do npm install -g --prefix "%RUNNER_TEMP%\happyherd-cli-prefix" "%%w" "%%f"

    - name: Debug npm global installation structure
      shell: cmd
      run: |
        set NPM_PREFIX=%RUNNER_TEMP%\happyherd-cli-prefix
        echo NPM_PREFIX: %NPM_PREFIX%
        echo Listing npm prefix directory:
        dir "%NPM_PREFIX%" 2>nul || echo Failed to list NPM_PREFIX
        echo.
        echo Checking for node_modules in npm prefix:
        if exist "%NPM_PREFIX%\node_modules" (
          echo Found node_modules directory
          dir "%NPM_PREFIX%\node_modules" 2>nul
          echo.
          echo Checking for @happyherd/cli package:
          if exist "%NPM_PREFIX%\node_modules\@happyherd\cli" (
            echo Found @happyherd/cli package
            dir "%NPM_PREFIX%\node_modules\@happyherd\cli" 2>nul
            echo.
            echo Checking for dist directory:
            if exist "%NPM_PREFIX%\node_modules\@happyherd\cli\dist" (
              echo Found dist directory
              dir "%NPM_PREFIX%\node_modules\@happyherd\cli\dist" 2>nul
            ) else (
              echo No dist directory found
            )
          ) else (
            echo No @happyherd/cli package found
            exit /b 1
          )
        ) else (
          echo No node_modules directory found
        )

    - name: Test binary execution
      shell: cmd
      run: |
        @echo on

        rem Get npm global prefix and add to PATH
        set NPM_PREFIX=%RUNNER_TEMP%\happyherd-cli-prefix
        set PATH=%NPM_PREFIX%;%PATH%
        echo NPM_PREFIX: %NPM_PREFIX%
        echo Current PATH: %PATH%

        rem Verify the canonical shim exists and the retired shim does not.
        where happyherd >nul 2>&1
        if errorlevel 1 (
          echo Error: happyherd not found in PATH
          exit /b 1
        )
        if exist "%NPM_PREFIX%\happy.cmd" (
          echo Error: the packed CLI installed a retired happy.cmd in NPM_PREFIX
          exit /b 1
        )
        if exist "%NPM_PREFIX%\node_modules\.bin\happy.cmd" (
          echo Error: retired happy.cmd exists in .bin directory
          exit /b 1
        )
        dir "%NPM_PREFIX%\*happy*" 2>nul || echo No happy files found in NPM_PREFIX

        rem Debug: Check the actual contents and encoding of the installed file
        if exist "%NPM_PREFIX%\happyherd.cmd" (
          echo File size and type:
          dir "%NPM_PREFIX%\happyherd.cmd"
          echo.
          echo First few lines of the file:
          type "%NPM_PREFIX%\happyherd.cmd" | head -5
          echo.
          echo Hex dump of first 50 bytes to check line endings:
          powershell -Command "Get-Content '%NPM_PREFIX%\happyherd.cmd' -Encoding Byte -TotalCount 50 | ForEach-Object { '{0:X2}' -f $_ } | Join-String -Separator ' '"
          echo.
          echo Testing with direct path...
          "%NPM_PREFIX%\happyherd.cmd" --help
        ) else (
          echo Testing happyherd --help...
          happyherd --help
        )
        if errorlevel 1 (
          echo Error: happyherd --help failed
          exit /b 1
        )

        rem Test version
        if exist "%NPM_PREFIX%\happyherd.cmd" (
          "%NPM_PREFIX%\happyherd.cmd" --version
        ) else (
          happyherd --version
        )
        if errorlevel 1 (
          echo Error: happyherd --version failed
          exit /b 1
        )

        rem Test doctor
        echo Testing happyherd doctor...
        if exist "%NPM_PREFIX%\happyherd.cmd" (
          "%NPM_PREFIX%\happyherd.cmd" doctor
        ) else (
          happyherd doctor
        )
        if errorlevel 1 (
          echo Error: happyherd doctor failed
          exit /b 1
        )

        rem Test daemon status
        echo Testing happyherd daemon status...
        if exist "%NPM_PREFIX%\happyherd.cmd" (
          "%NPM_PREFIX%\happyherd.cmd" daemon status
        ) else (
          happyherd daemon status
        )
        if errorlevel 1 (
          echo Error: happyherd daemon status failed
          exit /b 1
        )

        echo Smoke test passed on Windows!

# We don't need a smoke test for macOS because most contributors are developing on macOS.

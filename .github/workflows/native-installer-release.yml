name: HappyHerd native installer release

on:
  pull_request:
  push:
    tags:
      - happyherd-v*
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 1
  EXPO_NO_TELEMETRY: 1

jobs:
  build:
    name: Build and test ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install frozen dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Build prepared platform asset
        shell: bash
        run: |
          scripts/build-native-installer-asset.sh \
            --target "${{ matrix.target }}" \
            --output-dir "$RUNNER_TEMP/release"

      - name: Exercise the prepared install and upgrade
        shell: bash
        run: |
          scripts/test-native-installer-asset.sh \
            "$RUNNER_TEMP/release/happyherd-${{ matrix.target }}.tar.gz" \
            "${{ matrix.target }}"

      - name: Upload prepared platform asset
        uses: actions/upload-artifact@v4
        with:
          name: native-installer-${{ matrix.target }}
          path: ${{ runner.temp }}/release/happyherd-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish tagged release assets
    if: startsWith(github.ref, 'refs/tags/happyherd-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all prepared assets
        uses: actions/download-artifact@v4
        with:
          pattern: native-installer-*
          path: release
          merge-multiple: true

      - name: Create or refresh the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            version="${GITHUB_REF_NAME#happyherd-v}"
            release_flags=()
            case "$version" in
              *-*) release_flags+=(--prerelease) ;;
            esac
            gh release create "$GITHUB_REF_NAME" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "HappyHerd $version" \
              "${release_flags[@]}" \
              --generate-notes
          fi

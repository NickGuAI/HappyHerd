name: PR 277 isolated repair evidence
on:
  push:
    branches: [ci/pr-277-repair-20260917]
    paths: [.github/workflows/pr-277-repair.yml, .github/pr-277-repair.py]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fbbbaf7ebcfde0e6dcc795e673b6718ca9de7212
          fetch-depth: 0
          persist-credentials: false
      - name: Retain exact tracked source
        run: |
          mkdir -p "$RUNNER_TEMP/pr-277-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/pr-277-evidence/head.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/pr-277-evidence/source.tar.gz"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - name: Install pinned dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile > "$RUNNER_TEMP/pr-277-evidence/install.log" 2>&1
      - name: Capture exact compiler diagnostics
        working-directory: server
        run: |
          set +e
          pnpm --filter happy-app typecheck > "$RUNNER_TEMP/pr-277-evidence/typecheck.log" 2>&1
          result=$?
          echo "$result" > "$RUNNER_TEMP/pr-277-evidence/typecheck.exit"
          cat "$RUNNER_TEMP/pr-277-evidence/typecheck.log"
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-277-source-and-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/pr-277-evidence
          retention-days: 7
          compression-level: 0

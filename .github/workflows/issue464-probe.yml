name: Temporary issue 464 capture experiment
on:
  push:
    branches: [fix/464-golden-determinism]
    paths: [.github/workflows/issue464-probe.yml, scripts/kilv-capture/issue464-probe.mjs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install frozen dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile
      - name: Build production content
        working-directory: server
        run: APP_ENV=production pnpm --filter happyherd-app exec expo export --platform web --output-dir dist-ci
      - name: Install pinned Chromium
        working-directory: server
        run: pnpm --filter happyherd-app exec playwright-core install --with-deps chromium
      - name: Record runner CPU
        run: |
          mkdir -p .artifacts/issue464
          lscpu --json > .artifacts/issue464/cpu.json
      - name: Capture ten consecutive sets with the actual production script
        env:
          PROBE_ONE_PIXEL: ${{ github.event_name == 'push' && 'true' || 'false' }}
        run: node scripts/kilv-capture/issue464-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue464-${{ github.run_id }}
          path: .artifacts/issue464/

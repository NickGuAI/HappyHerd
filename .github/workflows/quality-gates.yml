name: HappyHerd quality gates
run-name: HappyHerd quality ${{ inputs.golden_request || github.event.pull_request.head.sha || github.sha }}

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      golden_mode:
        description: Golden comparison maintenance (PRs always compare)
        type: choice
        options: [compare, regenerate, one-pixel]
        default: compare
      golden_request:
        description: Unique regeneration request identifier
        type: string

permissions:
  contents: read

concurrency:
  group: happyherd-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 1
  EXPO_NO_TELEMETRY: 1
  HAPPYHERD_LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-latest
    outputs:
      run_suites: ${{ steps.scope.outputs.run_suites }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip suites for .dev-only changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] ||
             [[ -z "$BASE_SHA" ]] ||
             [[ "$BASE_SHA" =~ ^0+$ ]] ||
             ! git cat-file -e "${BASE_SHA}^{commit}"; then
            echo "run_suites=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- . ':(exclude).dev/**'; then
            echo "run_suites=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_suites=true" >> "$GITHUB_OUTPUT"
          fi

  clean-install:
    name: Clean install
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.run_suites == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install frozen dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile
      - name: Verify install is reproducible
        run: git diff --exit-code

  lint:
    name: Lint
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.run_suites == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frozen dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile
      - name: Lint changed source and repository contracts
        run: node scripts/lint-source.mjs
      - name: Verify product identity contract
        run: node scripts/verify-product-identity.mjs
      - name: Verify community contract
        run: node scripts/verify-community-contract.mjs
      - name: Verify public repository boundary
        run: |
          node scripts/test-public-boundary.mjs
          node scripts/verify-public-boundary.mjs

  typecheck:
    name: Typecheck
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.run_suites == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install frozen dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile
      - name: Typecheck production packages
        working-directory: server
        run: |
          pnpm --filter happy-app --fail-if-no-match typecheck
          pnpm --filter @slopus/happy-wire --fail-if-no-match build
          pnpm --filter happy-agent --fail-if-no-match build
          pnpm --filter @happyherd/cli --fail-if-no-match typecheck
          pnpm --filter ./packages/happy-server --fail-if-no-match typecheck
      - name: Enforce interface inventory and localization
        working-directory: server
        run: pnpm --filter happy-app --fail-if-no-match i18n:check

  unit-tests:
    name: Unit tests
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.run_suites == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install frozen dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile
      - name: Run unit suites
        working-directory: server
        run: |
          pnpm --filter happy-app --fail-if-no-match test --run
          pnpm --filter @slopus/happy-wire --fail-if-no-match test
          pnpm --filter happy-agent --fail-if-no-match test
          pnpm --filter @happyherd/cli --fail-if-no-match test
          pnpm --filter ./packages/happy-server --fail-if-no-match test

  production-build:
    name: Production build
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.run_suites == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install frozen dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile
      - name: Build production Web client
        working-directory: server
        run: APP_ENV=production pnpm --filter happy-app exec expo export --platform web --output-dir dist-ci
      - name: Verify built browser title
        run: grep -F '<title>HappyHerd</title>' server/packages/happy-app/dist-ci/index.html
      - name: Execute built browser client
        working-directory: server
        run: pnpm --filter happy-app --fail-if-no-match web:smoke
      # Bounded gate: production landing, restore-key, restore-device (offline),
      # server-config, changelog; fixture appearance and terminal.
      # All seven panels: desktop/mobile x light/dark = 28 committed baselines.
      - name: Install pinned golden browser
        working-directory: server
        run: pnpm --filter happy-app exec playwright-core install --with-deps chromium
      - name: Compare KILV golden images
        env:
          GOLDEN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.golden_mode || 'compare' }}
        run: node scripts/kilv-golden.mjs "$GOLDEN_MODE"
      - name: Upload golden comparison and readable diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kilv-golden-${{ github.run_id }}
          path: .artifacts/kilv-golden/
          if-no-files-found: error
          retention-days: 30
      - name: Upload explicitly regenerated baselines
        if: github.event_name == 'workflow_dispatch' && inputs.golden_mode == 'regenerate'
        uses: actions/upload-artifact@v4
        with:
          name: kilv-baselines-${{ github.run_id }}
          path: docs/acceptance/issue-287/golden/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Build daemon and server runtime
        working-directory: server
        run: |
          pnpm --filter @slopus/happy-wire --fail-if-no-match build
          pnpm --filter happy-agent --fail-if-no-match build
          pnpm --filter @happyherd/cli --fail-if-no-match build
          pnpm --filter ./packages/happy-server --fail-if-no-match build

name: HappyHerd public launcher release

on:
  push:
    tags:
      - happyherd-v*
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 1
  PNPM_VERSION: 10.11.0

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
            format: tar.gz
          - target: darwin-x64
            runner: macos-15-intel
            format: tar.gz
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            format: tar.gz
          - target: linux-x64
            runner: ubuntu-24.04
            format: tar.gz
          - target: win32-x64
            runner: windows-2022
            format: zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out exact tag source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install CI Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prepare digest-pinned relocatable Python
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            darwin-arm64)
              python_archive='cpython-3.13.14+20260718-aarch64-apple-darwin-install_only_stripped.tar.gz'
              python_sha256='06469835e1b0f73bcdb6c498a1d60ce579cc43a980754490a6f1e30062f43850'
              ;;
            darwin-x64)
              python_archive='cpython-3.13.14+20260718-x86_64-apple-darwin-install_only_stripped.tar.gz'
              python_sha256='93ec3863e3265ed87382a9216d2e973b47ab7ef330b496c0249bfc2bfc164cee'
              ;;
            linux-arm64)
              python_archive='cpython-3.13.14+20260718-aarch64-unknown-linux-gnu-install_only_stripped.tar.gz'
              python_sha256='8d5ac68458a4df9bc3c349d607da2674d8390ad26162482b17215563e45aca83'
              ;;
            linux-x64)
              python_archive='cpython-3.13.14+20260718-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz'
              python_sha256='571a710c62520b26dbadbd16e8850e24565c01dea94440223bc16caa21614021'
              ;;
            win32-x64)
              python_archive='cpython-3.13.14+20260718-x86_64-pc-windows-msvc-install_only_stripped.tar.gz'
              python_sha256='91ea0cd883295458fa766eae36241df3ecc21f7029814189707d54b450e55c69'
              ;;
          esac
          python_url="https://github.com/astral-sh/python-build-standalone/releases/download/20260718/${python_archive/+/%2B}"
          archive_path="$RUNNER_TEMP/$python_archive"
          extract_root="$RUNNER_TEMP/bundled-python"
          archive_shell_path="$archive_path"
          extract_shell_root="$extract_root"
          if [[ "${{ matrix.target }}" == win32-* ]]; then
            archive_shell_path="$(cygpath -u "$archive_path")"
            extract_shell_root="$(cygpath -u "$extract_root")"
          fi
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive_shell_path" "$python_url"
          PYTHON_ARCHIVE="$archive_path" PYTHON_SHA256="$python_sha256" node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const actual = crypto.createHash('sha256').update(fs.readFileSync(process.env.PYTHON_ARCHIVE)).digest('hex');
          if (actual !== process.env.PYTHON_SHA256) throw new Error('relocatable Python archive digest mismatch');
          NODE
          mkdir -p "$extract_shell_root"
          tar -xzf "$archive_shell_path" -C "$extract_shell_root"
          python_root="$(node -e "process.stdout.write(require('node:path').resolve(process.env.RUNNER_TEMP, 'bundled-python', 'python'))")"
          if [[ "${{ matrix.target }}" == win32-* ]]; then
            python_executable="$(node -e "process.stdout.write(require('node:path').resolve(process.env.RUNNER_TEMP, 'bundled-python', 'python', 'python.exe'))")"
          else
            python_executable="$(node -e "process.stdout.write(require('node:path').resolve(process.env.RUNNER_TEMP, 'bundled-python', 'python', 'bin', 'python3'))")"
          fi
          test -f "$python_executable"
          "$python_executable" -m pip install \
            --disable-pip-version-check --no-input --only-binary=:all: tzdata==2025.2
          "$python_executable" -I -X utf8 -c \
            'from importlib.metadata import version; from zoneinfo import ZoneInfo; assert version("tzdata") == "2025.2"; assert ZoneInfo("America/New_York").key == "America/New_York"'
          # The standalone runtime's terminal database contains names that
          # collide under the installer's cross-platform case-folded archive
          # policy. Broker-owned Python does not use this terminal database.
          BUNDLED_PYTHON_ROOT="$python_root" node -e \
            "require('node:fs').rmSync(require('node:path').join(process.env.BUNDLED_PYTHON_ROOT, 'share', 'terminfo'), { recursive: true, force: true })"
          printf 'BUNDLED_PYTHON_ROOT=%s\n' "$python_root" >> "$GITHUB_ENV"
          printf 'BUNDLED_PYTHON_EXECUTABLE=%s\n' "$python_executable" >> "$GITHUB_ENV"

      - name: Install frozen dependencies
        working-directory: server
        shell: bash
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node scripts/postinstall.cjs
          node packages/happy-cli/scripts/unpack-tools.cjs

      - name: Build maintained runtime and launcher
        working-directory: server
        run: |
          pnpm --filter happy --fail-if-no-match build
          pnpm --filter @happyherd/cli --fail-if-no-match build

      - name: Create locked launcher deployment
        shell: bash
        run: |
          deploy_log="$RUNNER_TEMP/happyherd-cli-deploy.log"
          set +e
          pnpm --dir server --frozen-lockfile --offline \
            --filter @happyherd/cli --fail-if-no-match deploy \
            --prod "$RUNNER_TEMP/payload" >"$deploy_log" 2>&1
          deploy_status=$?
          set -e
          if [[ "$deploy_status" -ne 0 ]] && \
             ! grep -Fq 'ERR_PNPM_LOCKFILE_CONFIG_MISMATCH' "$deploy_log"; then
            cat "$deploy_log" >&2
            exit 1
          fi
          test -f "$RUNNER_TEMP/payload/package.json"
          test -f "$RUNNER_TEMP/payload/pnpm-lock.yaml"
          node scripts/prepare-public-launcher-payload.mjs \
            --phase configure \
            --payload "$RUNNER_TEMP/payload" \
            --server-root "$GITHUB_WORKSPACE/server" \
            --target "${{ matrix.target }}"
          node -e "require('node:fs').rmSync(process.argv[1], { recursive: true, force: true })" \
            "$RUNNER_TEMP/payload/node_modules"
          (
            cd "$RUNNER_TEMP/payload"
            pnpm fetch --prod --frozen-lockfile --ignore-scripts
            pnpm install --prod --frozen-lockfile --offline --ignore-scripts
          )
          node scripts/prepare-public-launcher-payload.mjs \
            --phase finalize \
            --payload "$RUNNER_TEMP/payload" \
            --server-root "$GITHUB_WORKSPACE/server" \
            --target "${{ matrix.target }}"

      - name: Build Windows service host
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $VsWhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $Install = & $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $Install) { throw 'Visual C++ build tools are unavailable' }
          $VsDevCmd = Join-Path $Install 'Common7\Tools\VsDevCmd.bat'
          $Source = Join-Path $env:GITHUB_WORKSPACE 'installers\service\windows\happyherd-broker-service.cpp'
          $Output = Join-Path $env:RUNNER_TEMP 'happyherd-broker-service.exe'
          $ToolSource = Join-Path $env:GITHUB_WORKSPACE 'installers\service\windows\happyherd-tool-launcher.cpp'
          $ToolOutput = Join-Path $env:RUNNER_TEMP 'happyherd-tool-launcher.exe'
          $VerifierSource = Join-Path $env:GITHUB_WORKSPACE 'installers\service\windows\happyherd-acl-check.cpp'
          $VerifierOutput = Join-Path $env:RUNNER_TEMP 'happyherd-acl-check.exe'
          # The service starts with an intentionally minimal environment. Link
          # the MSVC runtime statically so every native boundary can start
          # without inheriting a runner- or workstation-specific DLL path.
          $Command = 'call "' + $VsDevCmd + '" -arch=x64 -host_arch=x64 && cl.exe /nologo /EHsc /std:c++17 /MT /W4 /WX /Fe:"' + $Output + '" "' + $Source + '" Advapi32.lib && cl.exe /nologo /EHsc /std:c++17 /MT /W4 /WX /Fe:"' + $ToolOutput + '" "' + $ToolSource + '" Advapi32.lib Crypt32.lib User32.lib && cl.exe /nologo /EHsc /std:c++17 /MT /W4 /WX /Fe:"' + $VerifierOutput + '" "' + $VerifierSource + '" Advapi32.lib'
          & cmd.exe /d /s /c $Command
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $Output) -or -not (Test-Path -LiteralPath $ToolOutput) -or -not (Test-Path -LiteralPath $VerifierOutput)) { throw 'Windows native host compilation failed' }

      - name: Build Unix isolated tool launcher
        if: matrix.target != 'win32-x64'
        shell: bash
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            installers/service/unix/happyherd-tool-launcher.c \
            -o "$RUNNER_TEMP/happyherd-tool-launcher"

      - name: Build macOS durable Keychain broker host
        if: startsWith(matrix.target, 'darwin-')
        shell: bash
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Wno-deprecated-declarations \
            installers/service/darwin/happyherd-keychain-broker.c \
            -framework Security -framework CoreFoundation \
            -o "$RUNNER_TEMP/happyherd-keychain-broker"

      - name: Stage traceable payload
        shell: bash
        run: |
          version="$(node -p "require('./server/packages/happyherd-cli/package.json').version")"
          case "${{ matrix.target }}" in
            linux-*) service_asset="$GITHUB_WORKSPACE/installers/service/linux/happyherd-broker.service.template"; secret_service_args="--secret-service-wrapper $GITHUB_WORKSPACE/installers/service/linux/happyherd-secret-service.sh"; tool_launcher="$RUNNER_TEMP/happyherd-tool-launcher"; uninstaller="$GITHUB_WORKSPACE/installers/uninstall.sh" ;;
            darwin-*) service_asset="$GITHUB_WORKSPACE/installers/service/darwin/dev.happyherd.broker.plist.template"; keychain_host_args="--keychain-host $RUNNER_TEMP/happyherd-keychain-broker"; tool_launcher="$RUNNER_TEMP/happyherd-tool-launcher"; uninstaller="$GITHUB_WORKSPACE/installers/uninstall.sh" ;;
            win32-*) service_asset="$RUNNER_TEMP/happyherd-broker-service.exe"; tool_launcher="$RUNNER_TEMP/happyherd-tool-launcher.exe"; trust_verifier_args="--trust-verifier $RUNNER_TEMP/happyherd-acl-check.exe"; uninstaller="$GITHUB_WORKSPACE/installers/uninstall.ps1" ;;
          esac
          node scripts/prepare-public-launcher-asset.mjs \
            --payload "$RUNNER_TEMP/payload" \
            --stage "$RUNNER_TEMP/stage" \
            --target "${{ matrix.target }}" \
            --source-sha "$GITHUB_SHA" \
            --version "$version" \
            --node-runtime "$(node -p 'process.execPath')" \
            --python-root "$BUNDLED_PYTHON_ROOT" \
            --python-executable "$BUNDLED_PYTHON_EXECUTABLE" \
            --service-asset "$service_asset" \
            ${secret_service_args:-} \
            ${keychain_host_args:-} \
            --tool-launcher "$tool_launcher" \
            ${trust_verifier_args:-} \
            --uninstaller "$uninstaller"

      - name: Smoke staged launcher on Unix
        if: matrix.format == 'tar.gz'
        shell: bash
        run: |
          "$RUNNER_TEMP/stage/happyherd/bin/happyherd" --version
          "$RUNNER_TEMP/stage/happyherd/bin/happyherd" --help
          python_relative="$(node -p "require('$RUNNER_TEMP/stage/happyherd/release.json').pythonRuntime")"
          env -i "$RUNNER_TEMP/stage/happyherd/$python_relative" -I -X utf8 -c 'from zoneinfo import ZoneInfo; assert ZoneInfo("America/New_York").key == "America/New_York"'

      - name: Smoke staged launcher on Windows
        if: matrix.format == 'zip'
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\stage\happyherd\happyherd.cmd" --version
          if ($LASTEXITCODE -ne 0) { throw 'staged launcher version check failed' }
          & "$env:RUNNER_TEMP\stage\happyherd\happyherd.cmd" --help
          if ($LASTEXITCODE -ne 0) { throw 'staged launcher help check failed' }
          $Receipt = Get-Content -Raw "$env:RUNNER_TEMP\stage\happyherd\release.json" | ConvertFrom-Json
          $Python = Join-Path "$env:RUNNER_TEMP\stage\happyherd" $Receipt.pythonRuntime
          & $Python -I -X utf8 -c 'import ctypes; from zoneinfo import ZoneInfo; assert ZoneInfo("America/New_York").key == "America/New_York"'
          if ($LASTEXITCODE -ne 0) { throw 'staged broker Python check failed' }

      - name: Package Unix asset
        if: matrix.format == 'tar.gz'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          version="$(node -p "require('./server/packages/happyherd-cli/package.json').version")"
          filename="happyherd-v${version}-${{ matrix.target }}.tar.gz"
          tar --format=ustar -czf "$RUNNER_TEMP/out/$filename" -C "$RUNNER_TEMP/stage" happyherd
          node scripts/write-public-asset-fragment.mjs \
            --asset "$RUNNER_TEMP/out/$filename" \
            --output "$RUNNER_TEMP/out/${{ matrix.target }}.asset.json" \
            --target "${{ matrix.target }}" \
            --format tar.gz \
            --source-sha "$GITHUB_SHA"

      - name: Package Windows asset
        if: matrix.format == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\out" | Out-Null
          $version = node -p "require('./server/packages/happyherd-cli/package.json').version"
          $filename = "happyherd-v$version-${{ matrix.target }}.zip"
          Compress-Archive -Path "$env:RUNNER_TEMP\stage\happyherd" -DestinationPath "$env:RUNNER_TEMP\out\$filename"
          node scripts/write-public-asset-fragment.mjs `
            --asset "$env:RUNNER_TEMP\out\$filename" `
            --output "$env:RUNNER_TEMP\out\${{ matrix.target }}.asset.json" `
            --target "${{ matrix.target }}" `
            --format zip `
            --source-sha "$env:GITHUB_SHA"

      # Retain the exact packaged bytes even when a native lifecycle check
      # fails. Downstream metadata and release publication still require the
      # complete build matrix to pass.
      - name: Upload native asset
        uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.target }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 7

      - name: Install and verify native Unix lifecycle
        if: matrix.format == 'tar.gz'
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./server/packages/happyherd-cli/package.json').version")"
          issuer_port="$(python -c 'import socket;s=socket.socket();s.bind(("127.0.0.1",0));print(s.getsockname()[1]);s.close()')"
          node scripts/prepare-native-release-fixture.mjs \
            --fragment "$RUNNER_TEMP/out/${{ matrix.target }}.asset.json" \
            --asset "$RUNNER_TEMP/out/happyherd-v${version}-${{ matrix.target }}.tar.gz" \
            --output "$RUNNER_TEMP/native-release" \
            --version "$version" \
            --base-url "http://127.0.0.1:9" \
            --shell sh
          scripts/prepare-agent-cli-fixtures.sh "$HOME/.local/bin"
          if [[ "${{ matrix.target }}" == linux-* ]]; then
            sudo chown root:root /opt
            sudo chmod 0755 /opt
            for trust_root in /opt /var /var/lib; do
              test -d "$trust_root"
              test ! -L "$trust_root"
              metadata="$(stat -c '%u:%a' "$trust_root")"
              uid="${metadata%%:*}"
              mode="${metadata#*:}"
              test "$uid" -eq 0
              test $((8#$mode & 022)) -eq 0
            done
          fi
          PATH="$HOME/.local/bin:$PATH" sh "$RUNNER_TEMP/native-release/install.sh" \
            --local-manifest "$RUNNER_TEMP/native-release/release-manifest.json" \
            --local-asset "$RUNNER_TEMP/native-release/happyherd-v${version}-${{ matrix.target }}.tar.gz"
          PATH="$HOME/.local/bin:$PATH" scripts/test-installed-happyherd-e2e.sh "$HOME/.local/bin/happyherd" "$issuer_port"
          case "${{ matrix.target }}" in
            linux-*) uninstaller="/opt/happyherd/$(id -u)/uninstall.sh" ;;
            darwin-*) uninstaller="/Library/Application Support/HappyHerd/$(id -u)/uninstall.sh" ;;
          esac
          uninstall_output="$(PATH="$HOME/.local/bin:$PATH" sh "$uninstaller")"
          printf '%s\n' "$uninstall_output"
          grep -Fq 'Removed 1 local issuer credential' <<<"$uninstall_output"
          test ! -e "$HOME/.local/bin/happyherd"
          test ! -e "$HOME/.claude/skills/generic-guide"
          test ! -e "$HOME/.codex/skills/generic-guide"
          if [[ "${{ matrix.target }}" == darwin-* ]]; then
            test ! -e "/Library/Application Support/HappyHerd/Secrets/$(id -u)/keychain-master"
            test ! -e "/Library/Application Support/HappyHerd/Secrets/$(id -u)"
          fi

      - name: Install and verify native Windows lifecycle
        if: matrix.format == 'zip'
        timeout-minutes: 15
        shell: pwsh
        run: |
          $Version = node -p "require('./server/packages/happyherd-cli/package.json').version"
          function Get-LoopbackPort {
            $Listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
            $Listener.Start(); $Port = ([Net.IPEndPoint]$Listener.LocalEndpoint).Port; $Listener.Stop(); return $Port
          }
          $IssuerPort = Get-LoopbackPort
          node scripts/prepare-native-release-fixture.mjs `
            --fragment "$env:RUNNER_TEMP\out\${{ matrix.target }}.asset.json" `
            --asset "$env:RUNNER_TEMP\out\happyherd-v$Version-${{ matrix.target }}.zip" `
            --output "$env:RUNNER_TEMP\native-release" `
            --version "$Version" `
            --base-url "http://127.0.0.1:9" `
            --shell powershell
          $Keeper = $null
          $TestUser = 'HHdE2E-' + [Guid]::NewGuid().ToString('N').Substring(0, 8)
          $TestPassword = 'Aa1!' + [Guid]::NewGuid().ToString('N') + [Guid]::NewGuid().ToString('N')
          $SpyUser = 'HHdSpy-' + [Guid]::NewGuid().ToString('N').Substring(0, 8)
          $SpyPassword = 'Aa1!' + [Guid]::NewGuid().ToString('N') + [Guid]::NewGuid().ToString('N')
          $TargetSid = $null
          $TargetHome = $null
          try {
            $SecurePassword = ConvertTo-SecureString $TestPassword -AsPlainText -Force
            New-LocalUser -Name $TestUser -Password $SecurePassword -Description 'HappyHerd native E2E target employee' -PasswordNeverExpires | Out-Null
            $UsersGroupSid = [Security.Principal.SecurityIdentifier]::new('S-1-5-32-545')
            $UsersGroup = Get-LocalGroup -SID $UsersGroupSid
            Add-LocalGroupMember -Group $UsersGroup -Member $TestUser
            $SpySecurePassword = ConvertTo-SecureString $SpyPassword -AsPlainText -Force
            New-LocalUser -Name $SpyUser -Password $SpySecurePassword -Description 'HappyHerd native E2E independent local spy' -PasswordNeverExpires | Out-Null
            Add-LocalGroupMember -Group $UsersGroup -Member $SpyUser
            $TargetSid = (Get-LocalUser -Name $TestUser).Sid.Value
            $TargetCredential = [Management.Automation.PSCredential]::new("$env:COMPUTERNAME\$TestUser", $SecurePassword)
            $KeeperCommand = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes('New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA, HKCU:\Environment | Out-Null; Start-Sleep -Seconds 1800'))
            $Keeper = Start-Process -FilePath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -Credential $TargetCredential -PassThru -ArgumentList @('-NoLogo', '-NoProfile', '-NonInteractive', '-EncodedCommand', $KeeperCommand)
            $ProfileKey = "Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$TargetSid"
            $HiveKey = "Registry::HKEY_USERS\$TargetSid"
            for ($Attempt = 0; $Attempt -lt 100; $Attempt += 1) { if ((Test-Path -LiteralPath $ProfileKey) -and (Test-Path -LiteralPath $HiveKey)) { break }; Start-Sleep -Milliseconds 100 }
            if (-not (Test-Path -LiteralPath $ProfileKey) -or -not (Test-Path -LiteralPath $HiveKey)) { throw 'standard employee profile/hive did not load' }
            $TargetHome = [IO.Path]::GetFullPath([Environment]::ExpandEnvironmentVariables((Get-ItemPropertyValue -LiteralPath $ProfileKey -Name ProfileImagePath)))
            $TargetLocalAppData = Join-Path $TargetHome 'AppData\Local'
            $AgentBin = Join-Path $TargetHome 'happyherd-e2e-agent-bin'
            & scripts/prepare-agent-cli-fixtures.ps1 $AgentBin
            $env:Path = "$AgentBin;$env:Path"
            & "$env:RUNNER_TEMP\native-release\install.ps1" `
              -LocalManifest "$env:RUNNER_TEMP\native-release\release-manifest.json" `
              -LocalAsset "$env:RUNNER_TEMP\native-release\happyherd-v$Version-${{ matrix.target }}.zip" `
              -TargetUserSid $TargetSid -TargetUserHome $TargetHome -TargetLocalAppData $TargetLocalAppData -Elevated
            $SidBytes = [Text.Encoding]::UTF8.GetBytes($TargetSid)
            $SidHasher = [Security.Cryptography.SHA256]::Create()
            try { $OwnerKey = ([BitConverter]::ToString($SidHasher.ComputeHash($SidBytes))).Replace('-', '').ToLowerInvariant().Substring(0, 20) } finally { $SidHasher.Dispose() }
            $InstallRoot = Join-Path $env:ProgramFiles "HappyHerd\$OwnerKey"
            $Launcher = Join-Path $InstallRoot 'happyherd.cmd'
            $InstalledIdentity = Get-Content -Raw -LiteralPath (Join-Path $InstallRoot 'installation.json') | ConvertFrom-Json
            if ($InstalledIdentity.ownerSid -ne $TargetSid -or $InstalledIdentity.ownerSid -eq [Security.Principal.WindowsIdentity]::GetCurrent().User.Value -or $InstalledIdentity.ownerHome -ne $TargetHome) { throw 'installation bound itself to the administrator instead of the standard employee' }
            $env:HAPPYHERD_E2E_TARGET_USER = "$env:COMPUTERNAME\$TestUser"
            $env:HAPPYHERD_E2E_TARGET_PASSWORD = $TestPassword
            $env:HAPPYHERD_E2E_SPY_USER = "$env:COMPUTERNAME\$SpyUser"
            $env:HAPPYHERD_E2E_SPY_PASSWORD = $SpyPassword
            & scripts/test-installed-happyherd-e2e.ps1 $Launcher $IssuerPort
            $UninstallOutput = & (Join-Path $InstallRoot 'uninstall.ps1') -Elevated | Out-String
            if (-not $UninstallOutput.Contains('Removed 1 local issuer credential')) { throw 'Windows uninstaller did not purge the live OS-store credential' }
            if (Test-Path -LiteralPath $InstallRoot) { throw 'Windows installation survived verified uninstall' }
            if (Test-Path -LiteralPath (Join-Path $TargetHome '.claude\skills\generic-guide')) { throw 'Claude Skill survived verified uninstall' }
            if (Test-Path -LiteralPath (Join-Path $TargetHome '.codex\skills\generic-guide')) { throw 'Codex Skill survived verified uninstall' }
          } finally {
            $env:HAPPYHERD_E2E_TARGET_PASSWORD = $null
            $env:HAPPYHERD_E2E_TARGET_USER = $null
            $env:HAPPYHERD_E2E_SPY_PASSWORD = $null
            $env:HAPPYHERD_E2E_SPY_USER = $null
            if ($Keeper -and -not $Keeper.HasExited) { Stop-Process -Id $Keeper.Id -Force -ErrorAction SilentlyContinue; $Keeper.WaitForExit() }
            if (Get-LocalUser -Name $TestUser -ErrorAction SilentlyContinue) { Remove-LocalUser -Name $TestUser }
            if (Get-LocalUser -Name $SpyUser -ErrorAction SilentlyContinue) { Remove-LocalUser -Name $SpyUser }
            if ($TargetSid) {
              $Profile = Get-CimInstance Win32_UserProfile -Filter "SID='$TargetSid'" -ErrorAction SilentlyContinue
              if ($Profile -and $TargetHome -and [StringComparer]::OrdinalIgnoreCase.Equals([string]$Profile.LocalPath, $TargetHome)) { Remove-CimInstance -InputObject $Profile -ErrorAction SilentlyContinue }
            }
          }

  metadata:
    name: Build and verify release metadata
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download all native assets
        uses: actions/download-artifact@v4
        with:
          pattern: launcher-*
          path: ${{ runner.temp }}/assets
          merge-multiple: true

      - name: Validate tag and build metadata
        shell: bash
        run: |
          version="$(node -p "require('./server/packages/happyherd-cli/package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" == "happyherd-v${version}" ]]
            release_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          else
            release_base="https://downloads.happyherd.example/releases/happyherd-v${version}"
          fi
          published_at="$(git show -s --format=%cI "$GITHUB_SHA")"
          mkdir -p "$RUNNER_TEMP/release"
          cp "$RUNNER_TEMP"/assets/happyherd-* "$RUNNER_TEMP/release/"
          node scripts/build-public-release-metadata.mjs \
            --assets-dir "$RUNNER_TEMP/assets" \
            --output "$RUNNER_TEMP/release" \
            --version "$version" \
            --source-sha "$GITHUB_SHA" \
            --published-at "$published_at" \
            --release-base-url "$release_base"
          node scripts/verify-public-launcher-release.mjs "$RUNNER_TEMP/release"

      - name: Upload verified public release
        uses: actions/upload-artifact@v4
        with:
          name: happyherd-public-release
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish tagged GitHub release
    if: startsWith(github.ref, 'refs/tags/happyherd-v')
    needs: metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified public release
        uses: actions/download-artifact@v4
        with:
          name: happyherd-public-release
          path: release

      - name: Publish immutable tag assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#happyherd-v}"
          prerelease=()
          case "$version" in *-*) prerelease+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "HappyHerd ${GITHUB_REF_NAME#happyherd-v}" \
            --notes-from-tag \
            "${prerelease[@]}"

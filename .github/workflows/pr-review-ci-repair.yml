name: Validate scoped PR CI repairs
on:
  push:
    branches: [chore/pr-review-evidence-20260918]
    paths: [.github/workflows/pr-review-ci-repair.yml]
permissions:
  contents: write
  pull-requests: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPAIR_PR: 280
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare exact-source repair in detached checkout
        run: |
          cp .dev/review/repair_checks.py "$RUNNER_TEMP/repair_checks.py"
          python3 "$RUNNER_TEMP/repair_checks.py" prepare
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install frozen dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile
      - name: Build workspace dependency required by CLI
        working-directory: server
        run: pnpm --filter happy-agent build
      - name: Validate complete CLI unit suite and absence of leaked timer errors
        working-directory: server
        run: |
          set -o pipefail
          pnpm --filter @happyherd/cli test 2>&1 | tee "$RUNNER_TEMP/check-repair/focused-tests.log"
      - name: Check repository gates and publish staging ref only
        run: python3 "$RUNNER_TEMP/repair_checks.py" publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-280-ci-repair
          path: ${{ runner.temp }}/check-repair
          retention-days: 7

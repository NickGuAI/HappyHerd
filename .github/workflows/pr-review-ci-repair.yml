name: Validate scoped PR CI repairs
on:
  push:
    branches: [chore/pr-review-evidence-20260918]
    paths: [.github/workflows/pr-review-ci-repair.yml]
permissions:
  contents: write
  pull-requests: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pr: [276, 280, 285]
    env:
      REPAIR_PR: ${{ matrix.pr }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare exact-source repair in detached checkout
        run: |
          python3 - <<'PY'
          import os, pathlib
          s=pathlib.Path('.dev/review/repair_checks.py').read_text()
          old="questions: [{ id: 'choice', question: 'Choose a target', options: [{ label: 'Main', value: 'main' }], multiple: false, allowCustom: false }]"
          new="questions: [{ id: 'choice', header: 'Target', question: 'Choose a target', options: [{ label: 'Main' }], multiSelect: false, allowCustom: false }]"
          assert s.count(old)==1
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'repair_checks.py').write_text(s.replace(old,new))
          PY
          python3 "$RUNNER_TEMP/repair_checks.py" prepare
      - uses: pnpm/action-setup@v4
        if: matrix.pr != 285
        with:
          version: 10.11.0
      - uses: oven-sh/setup-bun@v2
        if: matrix.pr != 285
        with:
          bun-version: 1.3.11
      - name: Install frozen dependencies
        if: matrix.pr != 285
        working-directory: server
        run: pnpm install --frozen-lockfile
      - name: Validate rendered tool contracts including missing-form fallback
        if: matrix.pr == 276
        working-directory: server
        run: |
          set -o pipefail
          pnpm --filter happy-app exec vitest run sources/components/tools/ToolView.test.ts sources/sync/agentCommunications.spec.ts 2>&1 | tee "$RUNNER_TEMP/check-repair/focused-tests.log"
      - name: Validate complete CLI unit suite and absence of leaked timer errors
        if: matrix.pr == 280
        working-directory: server
        run: |
          set -o pipefail
          pnpm --filter @happyherd/cli test 2>&1 | tee "$RUNNER_TEMP/check-repair/focused-tests.log"
      - name: Check repository gates and publish staging ref only
        run: python3 "$RUNNER_TEMP/repair_checks.py" publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-${{ matrix.pr }}-ci-repair
          path: ${{ runner.temp }}/check-repair
          retention-days: 7

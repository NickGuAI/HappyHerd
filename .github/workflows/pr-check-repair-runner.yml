name: PR check repair runner
on:
  push:
    branches: [chore/pr-check-repair-runner-20260917]
    paths: [.github/workflows/pr-check-repair-runner.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/upstream-4b7d763e
          fetch-depth: 0
      - name: Read actual failed assertion and matching source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 - <<'PY'
          import json, pathlib, re, subprocess
          p=subprocess.run(['gh','run','view','35250128772','--repo','NickGuAI/HappyHerd','--attempt','1','--log-failed'],capture_output=True,text=True)
          print('FAILED_LOG_READ_STATUS',p.returncode)
          if p.returncode: print(p.stderr)
          cleaned=re.sub(r'\x1b\[[0-9;]*m','',p.stdout)
          lines=cleaned.splitlines()
          print('\n'.join(lines[-170:]))
          paths=set(re.findall(r'(sources/[^\s:]+\.(?:test|spec)\.tsx?)',cleaned))
          for rel in sorted(paths):
              path=pathlib.Path('server/packages/happy-app')/rel
              print('LOG_SOURCE',rel,'EXISTS',path.is_file())
              if not path.is_file(): continue
              content=path.read_text().splitlines()
              for match in re.finditer(re.escape(rel)+r':(\d+)',cleaned):
                  i=int(match.group(1))-1
                  for j in range(max(0,i-25),min(len(content),i+30)):
                      print(f'{j+1}: {content[j]}')
          for name in ['.dev/VERIFY.md','AGENTS.md','server/AGENTS.md']:
              print('GUIDANCE',name)
              print(pathlib.Path(name).read_text())
          PY

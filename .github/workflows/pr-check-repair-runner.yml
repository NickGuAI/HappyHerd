name: PR check repair runner
on:
  push:
    branches: [chore/pr-check-repair-runner-20260917]
    paths: [.github/workflows/pr-check-repair-runner.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/upstream-4b7d763e
          fetch-depth: 0
      - name: Inspect exact heads and relevant source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          cat .dev/AGENTS.md
          python3 - <<'PY'
          import json, pathlib, subprocess
          def gh(*args):
              return json.loads(subprocess.check_output(['gh',*args], text=True))
          prs=gh('pr','list','--repo','NickGuAI/HappyHerd','--state','open','--limit','100','--json','number,title,headRefName,headRefOid,statusCheckRollup')
          for p in prs:
              print('PR_HEAD',p['number'],p['headRefName'],p['headRefOid'])
              for c in p['statusCheckRollup']:
                  print('CHECK',p['number'],c.get('name'),c.get('status'),c.get('conclusion'),c.get('detailsUrl'))
          root=pathlib.Path('server/packages/happy-app/sources')
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix not in ('.ts','.tsx'): continue
              s=p.read_text()
              if 'shows a truncation warning when the branch query hits the output cap' in s or 'knownChildren).toBe(knownChildren)' in s or 'class DirectoryTreeBrowser' in s:
                  print('MATCHED_SOURCE',p)
                  lines=s.splitlines()
                  hits=[i for i,l in enumerate(lines) if 'truncation warning' in l or 'knownChildren).toBe(knownChildren)' in l]
                  for i in hits:
                      for j in range(max(0,i-45),min(len(lines),i+65)):
                          print(f'{j+1}: {lines[j]}')
          print('DIRECTORY_TREE_FILES', subprocess.check_output(['git','ls-files','*Directory*Tree*'],text=True))
          print('RECENT_OWNED_PATCHES')
          print('\n'.join(pathlib.Path('docs/owned-patches.tsv').read_text().splitlines()[-12:]))
          PY

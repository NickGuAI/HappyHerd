name: Issue 345 native acceptance artifact

on:
  pull_request:
    paths:
      - .github/workflows/issue-345-native-acceptance.yml

permissions:
  contents: read

jobs:
  simulator-app:
    name: Unmodified iOS simulator build
    if: github.event.pull_request.number == 367
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      APP_ENV: production
      EXPO_NO_TELEMETRY: 1
      HAPPYHERD_APP_BUNDLE_ID: app.happyherd.issue345.acceptance
      HAPPYHERD_BUILD_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      EXPO_PUBLIC_HAPPYHERD_SERVER_URL: http://127.0.0.1:43545
      HAPPYHERD_EAS_PROJECT_ID: ''
      HAPPY_EAS_PROJECT_ID: ''
      HAPPYHERD_EAS_OWNER: ''
      HAPPY_EAS_OWNER: ''
      APPLE_TEAM_ID: ''
      RCT_NO_LAUNCH_PACKAGER: 1
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Record toolchain and isolate caches
        run: |
          mkdir -p acceptance-artifact "$RUNNER_TEMP/issue-345-metro"
          echo "TMPDIR=$RUNNER_TEMP/issue-345-metro/" >> "$GITHUB_ENV"
          echo "NODE_BINARY=$(command -v node)" >> "$GITHUB_ENV"
          { git rev-parse HEAD; xcodebuild -version; swift --version; node --version; pnpm --version; bun --version; pod --version; df -h .; } > acceptance-artifact/toolchain.txt
          test "$(git rev-parse HEAD)" = "$HAPPYHERD_BUILD_COMMIT_SHA"
      - name: Install unchanged dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile
      - name: Generate the isolated native host
        run: |
          pnpm --dir server --filter happyherd-app exec expo prebuild --platform ios --no-install > acceptance-artifact/prebuild.log 2>&1
          (cd server/packages/happyherd-app/ios && pod install) > acceptance-artifact/pods.log 2>&1
          git diff --exit-code -- server
          cp server/packages/happyherd-app/ios/Podfile.lock acceptance-artifact/Podfile.lock
          test "$(shasum -a 256 server/packages/happyherd-app/ios/Pods/RevenueCat/Sources/Paywalls/PaywallColor.swift | cut -d ' ' -f 1)" = 7d5eb572233ad587841d61be7294b32583d35724be6aa39006982d298774c511
      - name: Build unsigned Release simulator app
        run: |
          xcodebuild -workspace server/packages/happyherd-app/ios/HappyHerd.xcworkspace \
            -scheme HappyHerd -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/issue-345-derived" -jobs 1 \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            IPHONEOS_DEPLOYMENT_TARGET=15.1 \
            SWIFT_COMPILATION_MODE=singlefile SWIFT_ENABLE_BATCH_MODE=NO \
            SWIFT_OPTIMIZATION_LEVEL=-O build > acceptance-artifact/xcodebuild.log 2>&1
      - name: Verify and preserve the selected app
        run: |
          export ISSUE345_APP="$RUNNER_TEMP/issue-345-derived/Build/Products/Release-iphonesimulator/HappyHerd.app"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, plistlib
          app = pathlib.Path(os.environ['ISSUE345_APP'])
          bundle = (app / 'main.jsbundle').read_bytes()
          sha = os.environ['HAPPYHERD_BUILD_COMMIT_SHA']
          assert b'http://127.0.0.1:43545' in bundle
          configs = list(app.rglob('EXConstants.bundle/app.config'))
          assert len(configs) == 1
          config = json.loads(configs[0].read_text())
          assert config['extra']['app']['buildCommitSha'] == sha
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          assert info['CFBundleIdentifier'] == 'app.happyherd.issue345.acceptance'
          files = {str(p.relative_to(app)): hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(app.rglob('*')) if p.is_file()}
          receipt = {'sourceSha': sha, 'taskSpecificNativeSourcePatches': [], 'revenueCatSourcePatched': False, 'configuration': 'Release', 'architecture': 'arm64', 'bundleSha256': hashlib.sha256(bundle).hexdigest(), 'bundleIdentifier': info['CFBundleIdentifier'], 'appConfigPath': str(configs[0].relative_to(app)), 'appConfigSha256': hashlib.sha256(configs[0].read_bytes()).hexdigest(), 'files': files}
          pathlib.Path('acceptance-artifact/build-manifest.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          git diff --exit-code -- server
          ditto -c -k --sequesterRsrc --keepParent "$ISSUE345_APP" acceptance-artifact/HappyHerd.app.zip
          shasum -a 256 acceptance-artifact/HappyHerd.app.zip > acceptance-artifact/archive.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-345-native-${{ github.event.pull_request.head.sha }}
          path: acceptance-artifact/
          retention-days: 30
          if-no-files-found: error

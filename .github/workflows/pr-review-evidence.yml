name: Isolated PR review evidence
on:
  push:
    branches: [chore/pr-review-evidence-20260918]
    paths: [.github/workflows/pr-review-evidence.yml]
permissions:
  contents: write
  pull-requests: read
  checks: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install generator-only dependency
        run: |
          VERSION=$(node -p "require('./server/packages/happy-app/package.json').devDependencies.typescript")
          npm install --prefix "$RUNNER_TEMP/review-tools" --no-audit --no-fund "typescript@$VERSION"
      - name: Prepare scoped rebases without updating main or PR branches
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_EDITOR: 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          source = Path('.dev/review/prepare_branches.py').read_text()
          old = "duplicate='        const SpecificToolView = isToolIdentityCompatible && hasSpecializedContent ? getToolViewComponent(tool.name) : null;\\n'"
          new = "duplicate='                const SpecificToolView = isToolIdentityCompatible && hasSpecializedContent\\n                    ? getToolViewComponent(tool.name)\\n                    : null;\\n'"
          assert source.count(old) == 1
          source = source.replace(old, new)
          source = source.replace("stage=f'chore/pr-review-staging-20260918-{n}'", "stage=f'chore/pr-review-staging-" + os.environ['GITHUB_RUN_ID'] + "-{n}'")
          exec(compile(source, '.dev/review/prepare_branches.py', 'exec'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-pr-review
          path: ${{ runner.temp }}/prepared-pr-review
          retention-days: 7

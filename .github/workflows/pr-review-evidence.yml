name: Isolated PR review evidence
on:
  push:
    branches: [chore/pr-review-evidence-20260918]
    paths: [.github/workflows/pr-review-evidence.yml]
permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture exact heads and rehearse merges without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Nick Gu'
          git config user.email '76655953+NickGuAI@users.noreply.github.com'
          mkdir -p "$RUNNER_TEMP/pr-review"
          python3 - <<'PY'
          import json, os, pathlib, subprocess, tarfile
          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr-review'
          repo = 'NickGuAI/HappyHerd'
          def git(*args, cwd=root, check=True):
              return subprocess.run(['git', *args], cwd=cwd, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, check=check)
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/{path}'], text=True))
          main = api('branches/main')['commit']['sha']
          prs = api('pulls?state=open&per_page=100')
          if len(prs) == 100:
              raise RuntimeError('Pagination required; refusing incomplete inventory')
          report = {'main':main, 'prs':[]}
          git('fetch','origin',main)
          bases = {main}
          for p in prs:
              n = p['number']; detail = api(f'pulls/{n}')
              head = detail['head']['sha']; bases.add(detail['base']['sha'])
              git('fetch','origin',f'refs/pull/{n}/head')
              base = git('merge-base',main,head).stdout.strip(); bases.add(base)
              d = out / str(n); d.mkdir()
              (d/'pr.json').write_text(json.dumps(detail,indent=2))
              (d/'comments.json').write_text(json.dumps(api(f'issues/{n}/comments?per_page=100'),indent=2))
              (d/'reviews.json').write_text(json.dumps(api(f'pulls/{n}/reviews?per_page=100'),indent=2))
              checks = api(f'commits/{head}/check-runs?per_page=100')
              (d/'checks.json').write_text(json.dumps(checks,indent=2))
              (d/'statuses.json').write_text(json.dumps(api(f'commits/{head}/status'),indent=2))
              (d/'patch.diff').write_text(git('diff','--binary',base,head).stdout)
              work = pathlib.Path(os.environ['RUNNER_TEMP']) / f'review-pr-{n}'
              git('worktree','add','--detach',str(work),head)
              merge = git('merge','--no-commit','--no-ff',main,cwd=work,check=False)
              conflicts = git('diff','--name-only','--diff-filter=U',cwd=work).stdout.splitlines()
              (d/'merge.log').write_text(merge.stdout)
              (d/'conflicts.diff').write_text(git('diff','--cc',cwd=work).stdout)
              for path in conflicts:
                  dest = d/'conflicts'/path; dest.parent.mkdir(parents=True,exist_ok=True)
                  src = work/path
                  if src.is_file(): dest.write_bytes(src.read_bytes())
              entry = {'number':n,'head':head,'branch':detail['head']['ref'],'base':base,'draft':detail['draft'],'mergeable':detail.get('mergeable'),'merge_state':detail.get('mergeable_state'),'merge_exit':merge.returncode,'conflicts':conflicts,'checks':[{'name':c['name'],'status':c['status'],'conclusion':c['conclusion'],'url':c['html_url']} for c in checks['check_runs']]}
              report['prs'].append(entry)
              print(json.dumps(entry),flush=True)
              git('merge','--abort',cwd=work,check=False)
              git('worktree','remove','--force',str(work))
          suffixes={'.ts','.tsx','.js','.jsx','.mjs','.cjs','.json','.md','.sh','.yaml','.yml','.toml','.css','.txt','.tsv'}
          for base in bases:
              work = pathlib.Path(os.environ['RUNNER_TEMP']) / f'base-{base[:8]}'
              git('worktree','add','--detach',str(work),base)
              with tarfile.open(out/f'source-{base}.tar.gz','w:gz') as archive:
                  for path in git('ls-files',cwd=work).stdout.splitlines():
                      file=work/path
                      if file.is_file() and not file.is_symlink() and (file.suffix in suffixes or file.name in {'Dockerfile','.gitignore'}) and file.stat().st_size < 4000000:
                          archive.add(file,arcname=path,recursive=False)
              git('worktree','remove','--force',str(work))
          (out/'report.json').write_text(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-review-evidence
          path: ${{ runner.temp }}/pr-review
          retention-days: 7

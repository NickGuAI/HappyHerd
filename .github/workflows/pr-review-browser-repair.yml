name: Validate PR browser fixture repair
on:
  push:
    branches: [chore/pr-review-evidence-20260918]
    paths: [.github/workflows/pr-review-browser-repair.yml]
permissions:
  contents: write
  pull-requests: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare exact-source fixture transport repair
        run: |
          cp .dev/review/repair_browser_fixture.py "$RUNNER_TEMP/repair_browser_fixture.py"
          python3 "$RUNNER_TEMP/repair_browser_fixture.py" prepare
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install frozen dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile
      - name: Run complete app suite with unchanged assertions and deadlines
        working-directory: server
        run: |
          set -o pipefail
          pnpm --filter happy-app test --run 2>&1 | tee "$RUNNER_TEMP/browser-repair/app-tests.log"
      - name: Check repository gates and publish staging ref only
        run: python3 "$RUNNER_TEMP/repair_browser_fixture.py" publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-279-browser-repair
          path: ${{ runner.temp }}/browser-repair
          retention-days: 7

name: Daily Happy upstream sync

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-happy-upstream-sync
  cancel-in-progress: false

env:
  HAPPYHERD_SYNC_UPSTREAM_URL: https://github.com/slopus/happy.git
  HAPPYHERD_SYNC_ARTIFACT_NAME: upstream-sync-evidence-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  prepare:
    name: Freeze refs and prepare candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.prepare.outputs.outcome }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      upstream_sha: ${{ steps.prepare.outputs.upstream_sha }}
      result_sha: ${{ steps.prepare.outputs.result_sha }}
      artifact_url: ${{ steps.evidence.outputs.artifact-url }}
      artifact_digest: ${{ steps.evidence.outputs.artifact-digest }}
    steps:
      - name: Check out the workflow commit without credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Freeze main and upstream, then attempt the exact merge
        id: prepare
        env:
          HAPPYHERD_SYNC_ORIGIN_URL: ${{ github.server_url }}/${{ github.repository }}.git
          HAPPYHERD_SYNC_EXPECTED_BASE: ${{ github.sha }}
        run: |
          scripts/prepare-daily-upstream-sync.sh "$RUNNER_TEMP/upstream-sync-evidence"
          awk -F '\t' '
            $1 == "outcome" || $1 == "base_sha" ||
            $1 == "upstream_sha" || $1 == "result_sha" {
              print $1 "=" $2
            }
          ' "$RUNNER_TEMP/upstream-sync-evidence/metadata.tsv" >> "$GITHUB_OUTPUT"

      - name: Upload immutable merge evidence
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.HAPPYHERD_SYNC_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/upstream-sync-evidence/
          if-no-files-found: error
          retention-days: 90

  validate:
    name: Validate candidate without write credentials
    needs: prepare
    if: needs.prepare.outputs.outcome == 'clean'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
      NODE_ENV: test
    steps:
      - name: Check out the frozen base without credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Download immutable merge evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.HAPPYHERD_SYNC_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/upstream-sync-evidence

      - name: Verify evidence and materialize the candidate
        env:
          HAPPYHERD_SYNC_ORIGIN_URL: ${{ github.server_url }}/${{ github.repository }}.git
          HAPPYHERD_SYNC_EXPECTED_BASE: ${{ needs.prepare.outputs.base_sha }}
          HAPPYHERD_SYNC_EXPECTED_UPSTREAM: ${{ needs.prepare.outputs.upstream_sha }}
          HAPPYHERD_SYNC_EXPECTED_OUTCOME: ${{ needs.prepare.outputs.outcome }}
        run: >-
          scripts/verify-daily-upstream-sync-evidence.sh
          "$RUNNER_TEMP/upstream-sync-evidence" --materialize

      - name: Install frozen dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Run the complete repository contract suite
        run: scripts/contract-suite.sh

      - name: Run remaining type and localization gates
        working-directory: server
        run: |
          pnpm --filter happy-app --fail-if-no-match i18n:check
          pnpm --filter @slopus/happy-wire --fail-if-no-match typecheck
          pnpm --filter happy --fail-if-no-match typecheck
          pnpm --filter @happyherd/cli --fail-if-no-match typecheck

      - name: Build the production browser, daemon, and server
        working-directory: server
        run: |
          APP_ENV=production pnpm --filter happy-app exec expo export \
            --platform web --output-dir dist-ci
          grep -F '<title>HappyHerd</title>' packages/happy-app/dist-ci/index.html
          pnpm --filter happy --fail-if-no-match build
          pnpm --filter ./packages/happy-server --fail-if-no-match build

  publish:
    name: Publish verified result without executing imported code
    needs:
      - prepare
      - validate
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (needs.prepare.outputs.outcome != 'clean' || needs.validate.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out only the frozen trusted base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false

      - name: Download immutable merge evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.HAPPYHERD_SYNC_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/upstream-sync-evidence

      - name: Re-verify hashes and Git topology without checkout
        env:
          HAPPYHERD_SYNC_ORIGIN_URL: ${{ github.server_url }}/${{ github.repository }}.git
          HAPPYHERD_SYNC_EXPECTED_BASE: ${{ needs.prepare.outputs.base_sha }}
          HAPPYHERD_SYNC_EXPECTED_UPSTREAM: ${{ needs.prepare.outputs.upstream_sha }}
          HAPPYHERD_SYNC_EXPECTED_OUTCOME: ${{ needs.prepare.outputs.outcome }}
        run: >-
          scripts/verify-daily-upstream-sync-evidence.sh
          "$RUNNER_TEMP/upstream-sync-evidence"

      - name: Update the one issue or the one reviewed PR
        env:
          GH_TOKEN: ${{ github.token }}
          HAPPYHERD_SYNC_ORIGIN_URL: ${{ github.server_url }}/${{ github.repository }}.git
          HAPPYHERD_SYNC_EXPECTED_BASE: ${{ needs.prepare.outputs.base_sha }}
          HAPPYHERD_SYNC_EXPECTED_UPSTREAM: ${{ needs.prepare.outputs.upstream_sha }}
          HAPPYHERD_SYNC_EXPECTED_OUTCOME: ${{ needs.prepare.outputs.outcome }}
          HAPPYHERD_SYNC_ARTIFACT_URL: ${{ needs.prepare.outputs.artifact_url }}
          HAPPYHERD_SYNC_ARTIFACT_DIGEST: ${{ needs.prepare.outputs.artifact_digest }}
        run: scripts/publish-daily-upstream-sync.sh "$RUNNER_TEMP/upstream-sync-evidence"

name: HappyHerd contracts

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: happyherd-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-latest
    outputs:
      run_suites: ${{ steps.scope.outputs.run_suites }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip suites for .dev-only changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] ||
             [[ -z "$BASE_SHA" ]] ||
             [[ "$BASE_SHA" =~ ^0+$ ]] ||
             ! git cat-file -e "${BASE_SHA}^{commit}"; then
            echo "run_suites=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- . ':(exclude).dev/**'; then
            echo "run_suites=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_suites=true" >> "$GITHUB_OUTPUT"
          fi

  contracts:
    name: Contract suite
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.run_suites == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out full lineage
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Fetch public upstream lineage
        run: |
          git remote add upstream https://github.com/slopus/happy.git
          git fetch upstream main --tags

      - name: Install frozen dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Run complete contract suite
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/happyherd-logs"
          scripts/contract-suite.sh 2>&1 \
            | perl -pe 's/\e\[[0-?]*[ -\/]*[@-~]//g' \
            | tee "$RUNNER_TEMP/happyherd-logs/contracts.log"

      - name: Preserve contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-suite-${{ github.run_id }}
          path: ${{ runner.temp }}/happyherd-logs/contracts.log
          if-no-files-found: error
          retention-days: 7

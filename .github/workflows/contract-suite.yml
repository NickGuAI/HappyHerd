name: HappyHerd contracts

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: happyherd-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contract suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out full lineage
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Fetch public upstream lineage
        run: |
          git remote add upstream https://github.com/slopus/happy.git
          git fetch upstream main --tags

      - name: Install frozen dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Run complete contract suite
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/happyherd-logs"
          scripts/contract-suite.sh 2>&1 \
            | perl -pe 's/\e\[[0-?]*[ -\/]*[@-~]//g' \
            | tee "$RUNNER_TEMP/happyherd-logs/contracts.log"

      - name: Preserve contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-suite-${{ github.run_id }}
          path: ${{ runner.temp }}/happyherd-logs/contracts.log
          if-no-files-found: error
          retention-days: 7

  upstream-rehearsal:
    name: Real upstream rehearsal
    if: github.event_name != 'pull_request'
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out pushed main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Rehearse real upstream integration
        env:
          HAPPYHERD_CLONE_SOURCE: ${{ github.workspace }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/happyherd-logs"
          scripts/rehearse-upstream-sync.sh 2>&1 \
            | perl -pe 's/\e\[[0-?]*[ -\/]*[@-~]//g' \
            | tee "$RUNNER_TEMP/happyherd-logs/upstream-rehearsal.log"

      - name: Preserve rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-rehearsal-${{ github.run_id }}
          path: ${{ runner.temp }}/happyherd-logs/upstream-rehearsal.log
          if-no-files-found: error
          retention-days: 7
